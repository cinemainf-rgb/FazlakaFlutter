name: Build Flutter APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      - name: Create Flutter project structure
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.bak
          flutter create . --org com.fazlaka.app --project-name fazlaka
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.bak pubspec.yaml
          cat pubspec.yaml
      - run: flutter pub get
      - run: flutter analyze || true
      - run: flutter build apk --debug --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: fazlaka-flutter-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
