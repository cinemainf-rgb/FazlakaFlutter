name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true
      - name: Save our files
        run: |
          mkdir -p /tmp/save
          cp lib/main.dart /tmp/save/main.dart
          cp pubspec.yaml /tmp/save/pubspec.yaml
      - name: Create Android folder
        run: flutter create . --no-pub
      - name: Restore files + Inject Bluetooth permissions
        run: |
          cp /tmp/save/main.dart lib/main.dart
          cp /tmp/save/pubspec.yaml pubspec.yaml
          rm -rf test
          python3 -c "
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text()
          perms = '''    <uses-permission android:name=\"android.permission.BLUETOOTH\" />
              <uses-permission android:name=\"android.permission.BLUETOOTH_ADMIN\" />
              <uses-permission android:name=\"android.permission.BLUETOOTH_CONNECT\" />
              <uses-permission android:name=\"android.permission.BLUETOOTH_SCAN\" />
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />
          '''
          if 'BLUETOOTH_CONNECT' not in t:
              t = t.replace
