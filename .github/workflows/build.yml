name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      - name: Save our files
        run: |
          mkdir -p /tmp/save
          cp lib/main.dart /tmp/save/main.dart
          cp pubspec.yaml /tmp/save/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml /tmp/save/AndroidManifest.xml || echo "no manifest file"
      - name: Create Android folder
        run: flutter create .
      - name: Restore our files
        run: |
          cp /tmp/save/main.dart lib/main.dart
          cp /tmp/save/pubspec.yaml pubspec.yaml
          if [ -f /tmp/save/AndroidManifest.xml ]; then cp /tmp/save/AndroidManifest.xml android/app/src/main/AndroidManifest.xml; fi
          flutter pub get
      - name: Build APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fazlaka-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
